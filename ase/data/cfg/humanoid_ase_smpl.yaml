# if given, will override the device setting in gym.
env:
  numEnvs: 4096
  envSpacing: 2
  episodeLength: 300
  isFlagrun: False
  enableDebugVis: False

  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 2 # 30 Hz
  stateInit: "Hybrid"
  hybridInitProb: 0.5
  numAMPObsSteps: 10

  localRootObs: True
  keyBodies: ["R_Ankle", "L_Ankle", "R_Wrist", "L_Wrist"]
  contactBodies: ["R_Ankle", "L_Ankle", "R_Toe", "L_Toe"]
  resetBodies:
    [
      "Pelvis",
      "L_Hip",
      "L_Knee",
      "R_Hip",
      "R_Knee",
      "Torso",
      "Spine",
      "Chest",
      "Neck",
      "Head",
      "L_Thorax",
      "L_Shoulder",
      "L_Elbow",
      "L_Wrist",
      "L_Hand",
      "R_Thorax",
      "R_Shoulder",
      "R_Elbow",
      "R_Wrist",
      "R_Hand",
    ]
  terminationHeight: 0.15
  enableEarlyTermination: True

  asset:
    assetRoot: "ase/data/assets"
    assetFileName:
      - mjcf/smpl/a0f02530_smpl.xml
